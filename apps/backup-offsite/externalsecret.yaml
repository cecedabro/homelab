# Backblaze B2 credentials + rclone crypt password for the off-site backup job.
# OpenBao secret/backup/b2: B2_KEY_ID, B2_APPLICATION_KEY, B2_ENDPOINT, B2_BUCKET, CRYPT_PASSWORD.
# CRYPT_PASSWORD is the only way to read the off-site copy: keep it in Bitwarden as well.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: offsite-backup-b2
  namespace: kube-system
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target: {name: offsite-backup-b2, creationPolicy: Owner}
  dataFrom:
    - extract: {key: backup/b2}
