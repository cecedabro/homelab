# Cloudflare API token for cert-manager's DNS-01 challenge (OpenBao secret/cert-manager/cloudflare,
# key api-token). Token scope: Zone -> DNS -> Edit, only for cedricschippers.dev.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: cert-manager/cloudflare
        property: api-token
