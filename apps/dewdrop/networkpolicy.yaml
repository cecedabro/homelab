# Ingress: Cloudflare tunnel (public, behind Access), Traefik/Homepage/monitoring, LAN/Tailscale, same namespace.
# Egress: default deny. DNS and agent-status:8080 (the gateway) only. Undo: delete this file's objects.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-ingress
  namespace: dewdrop
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: homepage}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: cloudflare}}
        - ipBlock: {cidr: 192.168.50.0/24}
        - ipBlock: {cidr: 100.64.0.0/10}
        # each node's flannel/cni0 address: kube-proxy SNAT and kubelet probes
        - ipBlock: {cidr: 10.42.0.0/32}
        - ipBlock: {cidr: 10.42.0.1/32}
        - ipBlock: {cidr: 10.42.1.0/32}
        - ipBlock: {cidr: 10.42.1.1/32}
        - ipBlock: {cidr: 10.42.2.0/32}
        - ipBlock: {cidr: 10.42.2.1/32}
        - ipBlock: {cidr: 10.42.4.0/32}
        - ipBlock: {cidr: 10.42.4.1/32}
        - ipBlock: {cidr: 10.42.5.0/32}
        - ipBlock: {cidr: 10.42.5.1/32}
        - ipBlock: {cidr: 10.42.7.0/32}
        - ipBlock: {cidr: 10.42.7.1/32}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-egress
  namespace: dewdrop
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ai-agent}}
          podSelector: {matchLabels: {app: agent-status}}
      ports:
        - {protocol: TCP, port: 8080}
