# Cluster-wide store: any namespace can create ExternalSecrets that read from OpenBao.
# ESO logs in with its own ServiceAccount via OpenBao's Kubernetes auth (role set up
# by apps/openbao/bootstrap.sh), so there is no static token anywhere.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
