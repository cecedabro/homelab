# helm upgrade --install external-secrets external-secrets/external-secrets --version 2.12.0 \
#   -n external-secrets --create-namespace -f apps/external-secrets/values.yaml
installCRDs: true

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi

webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

certController:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 192Mi
