# Longhorn: values = apps/longhorn/values.yaml (UI service type + the two node policies, equal to the
# live settings). The backup target and recurring jobs are separate objects (live / apps/longhorn).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: longhorn, namespace: flux-system}
spec:
  interval: 30m
  timeout: 15m
  releaseName: longhorn
  targetNamespace: longhorn-system
  storageNamespace: longhorn-system
  chart:
    spec:
      chart: longhorn
      version: 1.12.0
      sourceRef: {kind: HelmRepository, name: longhorn}
  valuesFrom:
    - {kind: ConfigMap, name: longhorn-values, valuesKey: values.yaml}
