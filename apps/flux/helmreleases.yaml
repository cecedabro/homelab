  targetNamespace: cert-manager
  storageNamespace: cert-manager
  chart:
    spec:
      chart: cert-manager
      version: v1.21.2
      sourceRef: {kind: HelmRepository, name: jetstack}
  valuesFrom:
    - {kind: ConfigMap, name: cert-manager-values, valuesKey: values.yaml}
  # the startupapicheck post-install hook hangs helm (see apps/cert-manager/values.yaml)
  install: {disableHooks: true}
  upgrade: {disableHooks: true}
