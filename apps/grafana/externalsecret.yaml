# grafana-admin Secret, synced from OpenBao secret/monitoring/grafana.
# Change the password in OpenBao, then reset it in Grafana's DB (the env var only seeds it):
#   kubectl -n monitoring exec deploy/grafana -c grafana -- grafana cli admin reset-admin-password <pw>
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: monitoring/grafana
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: monitoring/grafana
        property: admin-password
