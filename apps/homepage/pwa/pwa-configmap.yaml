# Homepage's home-screen icons (iPhone/Android), mounted over the chart's default images in /app/public
# (persistence.pwa in values.yaml). Stored as base64 because Flux's source artifact drops *.png files.
# Source design: house with colour tiles, 1024px SVG rendered to PNG; regenerate by replacing the values below.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-pwa
  namespace: homepage
binaryData:
  android-chrome-192x192.png: 
  android-chrome-512x512.png: 
  apple-touch-icon.png: 
  favicon-16x16.png: 
  favicon-32x32.png: 
