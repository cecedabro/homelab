image:
  repository: ghcr.io/gethomepage/homepage

enableRbac: false

serviceAccount:
  name: ""
  create: false

service:
  main:
    type: LoadBalancer
    annotations:
      metallb.io/loadBalancerIPs: "192.168.50.101"
    ports:
      http:
        port: 3000
config:
  bookmarks: []

  services:
    - Cluster Management:
        - Portainer:
            href: https://portainer.home.cedricschippers.dev
            description: Container & pod management
            icon: portainer
            siteMonitor: https://portainer.portainer.svc.cluster.local:9443
        - Longhorn:
            href: https://longhorn.home.cedricschippers.dev
            description: Distributed storage
            icon: longhorn
            siteMonitor: http://longhorn-frontend.longhorn-system.svc.cluster.local
        - Grafana:
            href: https://grafana.home.cedricschippers.dev
            description: Monitoring dashboards
            icon: grafana
            siteMonitor: http://grafana.monitoring.svc.cluster.local
        - Prometheus:
            href: https://prometheus.home.cedricschippers.dev
            description: "Metrics & queries (login in the dashboard-login secret)"
            icon: prometheus
            siteMonitor: http://prometheus-server.monitoring.svc.cluster.local/-/healthy
        - OpenBao:
            href: https://openbao.home.cedricschippers.dev/ui/
            description: Secrets manager (synced into the cluster by External Secrets)
            icon: openbao
            # /sys/health returns 503 while sealed, so a red dot means: go unseal it
            siteMonitor: http://openbao.openbao.svc.cluster.local:8200/v1/sys/health
    - Gaming:
        - Minecraft Bedrock:
            href: https://portainer.home.cedricschippers.dev/#!/1/kubernetes/helm/minecraft/minecraft-bedrock?tab=resources
            description: "Connect via the relay, port 19132 (address in password manager)"
            icon: minecraft
        - Minecraft Creative:
            href: https://portainer.home.cedricschippers.dev/#!/1/kubernetes/helm/minecraft/minecraft-creative?tab=resources
            description: "Connect via the relay, port 19133 (address in password manager)"
            icon: minecraft
    - Cloud:
        - Nextcloud:
            href: https://nextcloud.home.cedricschippers.dev
            description: Files, photos & calendar
            icon: nextcloud
            siteMonitor: http://192.168.50.108/status.php
    - Projects:
        - Ruilingen:
            href: https://ruilingen.app
            description: Shift-swap site for colleagues (public, via Cloudflare)
            icon: mdi-swap-horizontal
            siteMonitor: http://ruilingen.ruilingen.svc.cluster.local/healthz
    - Media:
        - Jellyfin:
            href: https://jellyfin.cedricschippers.dev
            description: "Media streaming via Cloudflare (home: https://jellyfin.home.cedricschippers.dev)"
            icon: jellyfin
            siteMonitor: http://jellyfin.media.svc.cluster.local:8096
        - Jellyfin (LAN):
            href: https://jellyfin.home.cedricschippers.dev
            description: Direct on the home network (HTTPS), no Cloudflare hop
            icon: jellyfin
        - qBittorrent:
            href: https://qbittorrent.home.cedricschippers.dev
            description: Download client
            icon: qbittorrent
            siteMonitor: http://qbittorrent.media.svc.cluster.local:8080
        - Prowlarr:
            href: https://prowlarr.home.cedricschippers.dev
            description: Indexer manager
            icon: prowlarr
            siteMonitor: http://prowlarr.media.svc.cluster.local:9696
        - Radarr:
            href: https://radarr.home.cedricschippers.dev
            description: Movie automation
            icon: radarr
            siteMonitor: http://radarr.media.svc.cluster.local:7878
        - Sonarr:
            href: https://sonarr.home.cedricschippers.dev
            description: TV & anime automation
            icon: sonarr
            siteMonitor: http://sonarr.media.svc.cluster.local:8989
        - Readarr:
            href: https://readarr.home.cedricschippers.dev
            description: Ebook automation
            icon: readarr
            siteMonitor: http://readarr.media.svc.cluster.local:8787
        - FlareSolverr:
            href: http://192.168.50.109:8191
            description: Cloudflare bypass proxy for indexers (API only, no real UI)
            icon: flaresolverr
            siteMonitor: http://flaresolverr.media.svc.cluster.local:8191

  widgets:
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
    - search:
        provider: duckduckgo
        target: _blank

  settingsString: |
    title: Cedric's Homelab
    headerStyle: boxed

kubernetes:
  mode: disable

env:
  - name: HOMEPAGE_ALLOWED_HOSTS
    value: "192.168.50.101:3000,home.cedricschippers.dev,homepage.home.cedricschippers.dev"
# Requests/limits from 7-day Prometheus peaks (2026-10-13): CPU request only (no CPU limit, avoids throttling),
# memory request + limit so one app cannot starve the node.
resources:
  requests:
    cpu: 20m
    memory: 128Mi
  limits:
    memory: 384Mi
