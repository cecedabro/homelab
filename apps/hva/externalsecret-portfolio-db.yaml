# portfolio-db-secret (Postgres for the hva portfolio app), synced from
# OpenBao secret/hva/portfolio-db-secret.
# POSTGRES_PASSWORD only seeds the DB on first init: changing it in OpenBao does
# NOT change the real DB password, run ALTER USER in Postgres as well.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: portfolio-db-secret
  namespace: hva
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: portfolio-db-secret
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_DB
      remoteRef:
        key: hva/portfolio-db-secret
        property: POSTGRES_DB
    - secretKey: POSTGRES_USER
      remoteRef:
        key: hva/portfolio-db-secret
        property: POSTGRES_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: hva/portfolio-db-secret
        property: POSTGRES_PASSWORD
