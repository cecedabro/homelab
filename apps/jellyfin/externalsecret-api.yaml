# Jellyfin API key (OpenBao secret/media/jellyfin, key api-key). Used by Radarr and Sonarr's
# "Emby / Jellyfin" connection to trigger a library scan right after each import: Jellyfin's
# realtime monitor can't see changes on the NFS share by itself.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jellyfin-api
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: jellyfin-api
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: media/jellyfin
        property: api-key
