image:
  repository: docker.io/jellyfin/jellyfin

service:
  type: LoadBalancer
  port: 8096
  annotations:
    metallb.io/loadBalancerIPs: "192.168.50.102"

# RWO Longhorn volumes + a single GPU: old pod must stop before the new one starts
deploymentStrategy:
  type: Recreate

runtimeClassName: nvidia

nodeSelector:
  kubernetes.io/hostname: k3s-gpu-01

tolerations:
  - key: dedicated
    operator: Equal
    value: gpu
    effect: NoSchedule

# Requests/limits from 7-day Prometheus peaks (2026-10-13); no CPU limit (transcoding bursts)
resources:
  requests:
    cpu: 100m
    memory: 1Gi
  limits:
    nvidia.com/gpu: 1
    memory: 4Gi

persistence:
  config:
    enabled: true
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: longhorn
  media:
    enabled: true
    type: pvc
    accessMode: ReadWriteMany
    size: 3600Gi
    storageClass: ""
    existingClaim: nfs-media
    mountPath: /media/movies
  cache:
    enabled: true
    type: pvc
    accessMode: ReadWriteOnce
    size: 10Gi
    storageClass: longhorn

extraVolumes:
  - name: movies
    persistentVolumeClaim:
      claimName: nfs-media

extraVolumeMounts:
  - name: movies
    mountPath: /movies
    subPath: movies