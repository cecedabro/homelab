image:
  repository: docker.io/jellyfin/jellyfin

service:
  type: LoadBalancer
  port: 8096
  annotations:
    metallb.io/loadBalancerIPs: "192.168.50.102"

# RWO Longhorn volumes + a single GPU: old pod must stop before the new one starts
deploymentStrategy:
  type: Recreate

runtimeClassName: nvidia

nodeSelector:
  kubernetes.io/hostname: k3s-gpu-01

tolerations:
  - key: dedicated
    operator: Equal
    value: gpu
    effect: NoSchedule

# Requests/limits from 7-day Prometheus peaks (2026-10-13); no CPU limit (transcoding bursts)
resources:
  requests:
    cpu: 100m
    memory: 1Gi
  limits:
    nvidia.com/gpu: 1
    memory: 4Gi

persistence:
  config:
    enabled: true
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: longhorn
  # The whole NAS is NOT mounted (this would expose downloads, books and the backups).
  # With media disabled the chart puts an empty dir at /media; volumeMounts below add only the
  # two library folders inside it.
  media:
    enabled: false
  cache:
    enabled: true
    type: pvc
    accessMode: ReadWriteOnce
    size: 10Gi
    storageClass: longhorn

# Jellyfin only sees the two library folders of the NAS, read-write (subtitles are saved next to
# the media, SaveSubtitlesWithMedia). Same paths as before, so the libraries need no rescan.
# Blast radius if Jellyfin (public via Cloudflare) is ever compromised: movies and tv only, not
# downloads, the Longhorn/k3s backups or anything else on the NAS.
volumes:
  - name: nas
    persistentVolumeClaim:
      claimName: nfs-media

volumeMounts:
  - name: nas
    mountPath: /media/movies
    subPath: movies
  - name: nas
    mountPath: /media/tv
    subPath: tv