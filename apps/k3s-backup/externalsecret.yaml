# Encryption passphrase for the k3s datastore backups (apps/k3s-backup/cronjob.yaml).
# OpenBao secret/kube-system/k3s-backup: passphrase. Without it the backups can't be decrypted:
# keep it in Bitwarden too. Changing it only affects new backups.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: k3s-backup-passphrase, namespace: kube-system}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target: {name: k3s-backup-passphrase, creationPolicy: Owner}
  dataFrom: [{extract: {key: kube-system/k3s-backup}}]
