# Longhorn (chart longhorn/longhorn 1.12.0), managed by Flux (apps/flux/helmreleases.yaml).
# defaultSettings land in Longhorn's default-setting ConfigMap and are applied by longhorn-manager,
# so this file is the source of truth for these settings; others can still be changed in the UI.
service:
  ui:
    # Internal only: https://longhorn.home.cedricschippers.dev (Traefik + basic auth).
    # The former LoadBalancer IP 192.168.50.104 was removed so the login can't be bypassed.
    type: ClusterIP

defaultSettings:
  # Move pods automatically when a node dies instead of leaving them stuck on its volumes
  nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
  # `kubectl drain` waits for replicas to be rebuilt elsewhere before the node goes down
  nodeDrainPolicy: block-for-eviction-if-contains-last-replica
