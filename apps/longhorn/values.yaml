# Longhorn release: helm -n longhorn-system (chart longhorn/longhorn 1.12.0)
# Settings below were applied live via `kubectl patch settings.longhorn.io` on 2026-10-12.
# defaultSettings only seed a fresh install; keep this file in sync with the live settings.
defaultSettings:
  # Move pods automatically when a node dies instead of leaving them stuck on its volumes
  nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
  # `kubectl drain` waits for replicas to be rebuilt elsewhere before the node goes down
  nodeDrainPolicy: block-for-eviction-if-contains-last-replica
