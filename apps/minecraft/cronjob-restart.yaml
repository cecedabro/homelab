apiVersion: v1
kind: ServiceAccount
metadata:
  name: minecraft-restarter
  namespace: minecraft
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployment-restarter
  namespace: minecraft
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: minecraft-restarter-binding
  namespace: minecraft
subjects:
  - kind: ServiceAccount
    name: minecraft-restarter
    namespace: minecraft
roleRef:
  kind: Role
  name: deployment-restarter
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: minecraft-restart
  namespace: minecraft
spec:
  schedule: "0 6 * * 1"   # every Monday 6am
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 300
      template:
        spec:
          serviceAccountName: minecraft-restarter
          containers:
            - name: kubectl
              image: bitnami/kubectl
              command:
                - sh
                - -c
                - |
                  kubectl rollout restart deployment/minecraft-bedrock-minecraft-bedrock -n minecraft
                  kubectl rollout restart deployment/minecraft-creative-minecraft-bedrock -n minecraft
          restartPolicy: Never