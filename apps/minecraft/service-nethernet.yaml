# NetherNet exposure for the two Bedrock servers (Bedrock >= 1.26.52 only supports NetherNet).
# NetherNet = a TCP handshake on server-port (19132) + a separate UDP connection per player on a
# port the server picks. The server's `server-udp-ports` (in /data/server.properties, on the volume)
# pins that UDP window to 32000-32019 and advertises the address clients must use:
#   server-udp-ports=<advertised ip>:32000-32019:32000-32019        (external range : internal range)
# so every address listed there must be reachable for TCP 19132 AND UDP 32000-32019.
#   LAN (this file):   bedrock 192.168.50.104, creative 192.168.50.113 (MetalLB), same ports on both IPs
#   Internet (later):  add a second entry with the public address, e.g. `,<public ip>:EXT-EXT:32000-32019`
# externalTrafficPolicy Cluster: with Local, kube-proxy on cp-01 (the Tailscale subnet router) drops packets that
# the Pi forwards to these LB IPs, because cp-01 has no local endpoint. Cluster costs the real client source address.
# The chart's own NodePort services (UDP 30000/30001, RakNet era) are still there for the old relay.
---
apiVersion: v1
kind: Service
metadata:
  name: minecraft-bedrock-nethernet
  namespace: minecraft
  annotations:
    metallb.io/loadBalancerIPs: "192.168.50.104"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app: minecraft-bedrock-minecraft-bedrock
  ports:
    - {name: signaling, port: 19132, targetPort: 19132, protocol: TCP}
    - {name: udp-32000, port: 32000, targetPort: 32000, protocol: UDP}
    - {name: udp-32001, port: 32001, targetPort: 32001, protocol: UDP}
    - {name: udp-32002, port: 32002, targetPort: 32002, protocol: UDP}
    - {name: udp-32003, port: 32003, targetPort: 32003, protocol: UDP}
    - {name: udp-32004, port: 32004, targetPort: 32004, protocol: UDP}
    - {name: udp-32005, port: 32005, targetPort: 32005, protocol: UDP}
    - {name: udp-32006, port: 32006, targetPort: 32006, protocol: UDP}
    - {name: udp-32007, port: 32007, targetPort: 32007, protocol: UDP}
    - {name: udp-32008, port: 32008, targetPort: 32008, protocol: UDP}
    - {name: udp-32009, port: 32009, targetPort: 32009, protocol: UDP}
    - {name: udp-32010, port: 32010, targetPort: 32010, protocol: UDP}
    - {name: udp-32011, port: 32011, targetPort: 32011, protocol: UDP}
    - {name: udp-32012, port: 32012, targetPort: 32012, protocol: UDP}
    - {name: udp-32013, port: 32013, targetPort: 32013, protocol: UDP}
    - {name: udp-32014, port: 32014, targetPort: 32014, protocol: UDP}
    - {name: udp-32015, port: 32015, targetPort: 32015, protocol: UDP}
    - {name: udp-32016, port: 32016, targetPort: 32016, protocol: UDP}
    - {name: udp-32017, port: 32017, targetPort: 32017, protocol: UDP}
    - {name: udp-32018, port: 32018, targetPort: 32018, protocol: UDP}
    - {name: udp-32019, port: 32019, targetPort: 32019, protocol: UDP}
---
apiVersion: v1
kind: Service
metadata:
  name: minecraft-creative-nethernet
  namespace: minecraft
  annotations:
    metallb.io/loadBalancerIPs: "192.168.50.113"
spec:
