# cloudflared only makes outbound connections to Cloudflare; nothing needs to reach it.
# Undo: kubectl delete -f this file.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: cloudflare
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress: []
