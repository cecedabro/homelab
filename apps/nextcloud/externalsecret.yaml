# nextcloud-admin Secret, synced from OpenBao secret/nextcloud/nextcloud-admin.
# Nextcloud only reads the admin password at first install. After changing it in
# OpenBao (and once ESO has synced + the pod restarted), push it into Nextcloud:
#   kubectl -n nextcloud exec deploy/nextcloud -- su -s /bin/sh www-data -c \
#     'OC_PASS="$NEXTCLOUD_ADMIN_PASSWORD" php occ user:resetpassword --password-from-env "$NEXTCLOUD_ADMIN_USER"'
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-admin
  namespace: nextcloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: nextcloud-admin
    creationPolicy: Owner
  data:
    - secretKey: nextcloud-username
      remoteRef:
        key: nextcloud/nextcloud-admin
        property: nextcloud-username
    - secretKey: nextcloud-password
      remoteRef:
        key: nextcloud/nextcloud-admin
        property: nextcloud-password
