nextcloud:
  host: 192.168.50.108
  existingSecret:
    enabled: true
    secretName: nextcloud-admin
    usernameKey: nextcloud-username
    passwordKey: nextcloud-password
  trustedDomains:
    - 192.168.50.108
    - nextcloud.home.cedricschippers.dev
    - localhost
    - 10.42.0.0/16

  configs:
    custom.config.php: |-
      <?php
      $CONFIG = array (
        'trusted_domains' => array(
          0 => 'localhost',
          1 => '192.168.50.108',
          2 => '10.42.0.0/16',
          3 => 'nextcloud.home.cedricschippers.dev',
        ),
        // Traefik terminates TLS for nextcloud.home.cedricschippers.dev; trusting the pod
        // network lets Nextcloud read X-Forwarded-Proto, so https (via Traefik) and plain http
        // (via 192.168.50.108) both generate correct links. No fixed overwriteprotocol.
        'trusted_proxies' => array('10.42.0.0/16'),
        'forwarded_for_headers' => array('HTTP_X_FORWARDED_FOR'),
      );

  extraVolumes:
    - name: nfs-media
      persistentVolumeClaim:
        claimName: nfs-media

  extraVolumeMounts:
    - name: nfs-media
      mountPath: /mnt/media-storage

service:
  type: LoadBalancer
  port: 80

persistence:
  enabled: true
  storageClass: longhorn
  size: 5Gi
# Requests/limits from 7-day Prometheus peaks (2026-10-13): CPU request only (no CPU limit, avoids throttling),
# memory request + limit so one app cannot starve the node.
resources:
  requests:
    cpu: 50m
    memory: 384Mi
  limits:
    memory: 1536Mi
