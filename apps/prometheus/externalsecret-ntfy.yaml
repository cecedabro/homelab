# Alertmanager -> ntfy webhook URLs (the topic acts as a password). OpenBao secret/monitoring/ntfy:
# url, url-critical. Alertmanager reads them via url_file, see apps/prometheus/values.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: alertmanager-ntfy, namespace: monitoring}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target: {name: alertmanager-ntfy, creationPolicy: Owner}
  dataFrom: [{extract: {key: monitoring/ntfy}}]
