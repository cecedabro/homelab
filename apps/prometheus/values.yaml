server:
  # Prometheus UI on the LAN (no auth: LAN-only, never route this through Cloudflare)
  service:
    type: LoadBalancer
    servicePort: 80
    annotations:
      metallb.io/loadBalancerIPs: "192.168.50.113"
  persistentVolume:
    enabled: true
    storageClass: longhorn
    size: 10Gi

alertmanager:
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 2Gi

prometheus-node-exporter:
  enabled: true

kube-state-metrics:
  enabled: true