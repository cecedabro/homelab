# Requests/limits from 7-day Prometheus peaks (2026-10-13): CPU request only (no CPU limit,
# avoids throttling), memory request + limit so one component cannot starve the node.
server:
  # Internal only: reachable at https://prometheus.home.cedricschippers.dev (Traefik + basic auth).
  # The former LoadBalancer IP 192.168.50.113 was removed so the login can't be bypassed.
  service:
    type: ClusterIP
    servicePort: 80
  persistentVolume:
    enabled: true
    storageClass: longhorn
    size: 10Gi
  resources:
    requests:
      cpu: 50m
      memory: 768Mi
    limits:
      memory: 2Gi

alertmanager:
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 2Gi
  # Notifications go to the ntfy app (public ntfy.sh, built-in "alertmanager" template).
  # The topic works like a password, so the URLs live in the Secret alertmanager-ntfy
  # (keys: url, url-critical; created by hand, not in git) and are read via url_file.
  extraSecretMounts:
    - name: ntfy
      mountPath: /etc/alertmanager-secrets
      secretName: alertmanager-ntfy
      readOnly: true
  config:
    global: {}
    route:
      receiver: ntfy
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - matchers: ['severity="critical"']
          receiver: ntfy-critical
    receivers:
      - name: ntfy
        webhook_configs:
          - url_file: /etc/alertmanager-secrets/url
            send_resolved: true
      - name: ntfy-critical
        webhook_configs:
          - url_file: /etc/alertmanager-secrets/url-critical
            send_resolved: true
    templates:
      - /etc/alertmanager/*.tmpl
  resources:
    requests:
      cpu: 5m
      memory: 32Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

kube-state-metrics:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

prometheus-pushgateway:
  resources:
    requests:
      cpu: 5m
      memory: 32Mi
    limits:
      memory: 128Mi

# Scrape Longhorn's own metrics (volume robustness, node/disk state) for the alerts below
extraScrapeConfigs: |
  - job_name: longhorn
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names: [longhorn-system]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        regex: longhorn-backend;manager
        action: keep

# Homelab alert rules. Visible in Prometheus (http://192.168.50.113/alerts) and Alertmanager;
# a notification channel (Telegram/Discord/ntfy/email) still has to be wired into Alertmanager.
serverFiles:
  alerting_rules.yml:
    groups:
      - name: nodes
        rules:
          - alert: NodeDown
            expr: kube_node_status_condition{condition="Ready",status="true"} == 0
            for: 5m
            labels: {severity: critical}
            annotations:
              summary: "Node {{ $labels.node }} is not Ready"
          - alert: NodeDiskAlmostFull
            expr: (node_filesystem_avail_bytes{fstype="ext4",mountpoint!~"/boot|/var/lib/kubelet.*"} / node_filesystem_size_bytes) < 0.15
            for: 15m
            labels: {severity: warning}
            annotations:
              summary: "{{ $labels.node }} {{ $labels.mountpoint }} has {{ $value | humanizePercentage }} free"
          - alert: NodeMemoryPressure
            expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.10
            for: 10m
            labels: {severity: warning}
            annotations:
              summary: "{{ $labels.node }} has {{ $value | humanizePercentage }} memory available"
          - alert: NodeLinkNotGigabit
            # the NAS link silently ran at 100 Mbit/s for months
            expr: node_network_speed_bytes{device=~"en.*|eth.*"} * 8 < 1e9 and node_network_up{device=~"en.*|eth.*"} == 1
            for: 10m
            labels: {severity: warning}
            annotations:
              summary: "{{ $labels.node }} {{ $labels.device }} links at {{ $value | humanize }}bit/s"
      - name: workloads
        rules:
          - alert: PodCrashLooping
            expr: increase(kube_pod_container_status_restarts_total[30m]) > 3
            labels: {severity: warning}
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) restarted {{ $value | humanize }}x in 30m"
          - alert: PodNotReady
            expr: sum by (namespace, pod) (kube_pod_status_ready{condition="true"} == 0) * on (namespace, pod) group_left() (sum by (namespace, pod) (kube_pod_status_phase{phase=~"Running|Pending"}) > 0)
            for: 15m
            labels: {severity: warning}
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} not ready for 15m"
          - alert: OpenBaoSealed
            # readiness probe runs `bao status`, which fails while sealed
            expr: kube_pod_status_ready{namespace="openbao",condition="true"} == 0
            for: 2m
            labels: {severity: critical}
            annotations:
              summary: "OpenBao is sealed or down: unseal it (secrets stop syncing)"
      - name: storage
        rules:
          - alert: PersistentVolumeAlmostFull
            expr: (kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes) < 0.10
            for: 15m
            labels: {severity: warning}
            annotations:
              summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has {{ $value | humanizePercentage }} free"
          - alert: LonghornVolumeDegraded
            # robustness: 1=healthy 2=degraded 3=faulted
            expr: longhorn_volume_robustness >= 2
            for: 15m
            labels: {severity: warning}
            annotations:
              summary: "Longhorn volume {{ $labels.volume }} is {{ if eq $value 3.0 }}FAULTED{{ else }}degraded{{ end }}"
          - alert: LonghornNodeDown
            expr: longhorn_node_status{condition="ready"} == 0
            for: 5m
            labels: {severity: critical}
            annotations:
              summary: "Longhorn node {{ $labels.node }} is not ready"
