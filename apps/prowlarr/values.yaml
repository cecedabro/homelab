env:
  TZ: "Europe/Amsterdam"

service:
  main:
    annotations:
      metallb.universe.tf/loadBalancerIPs: "192.168.50.105"
    ports:
      http:
        port: 9696

persistence:
  config:
    enabled: true
    storageClass: longhorn
    size: 1Gi

defaultPodOptions:
  securityContext:
    runAsUser: 568
    runAsGroup: 568
    fsGroup: 568
    fsGroupChangePolicy: "OnRootMismatch"
