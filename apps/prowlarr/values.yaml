env:
  TZ: "Europe/Amsterdam"

service:
  main:
    type: LoadBalancer
    annotations:
      metallb.io/loadBalancerIPs: "192.168.50.105"
    ports:
      http:
        port: 9696

persistence:
  config:
    enabled: true
    storageClass: longhorn
    size: 1Gi

defaultPodOptions:
  securityContext:
    runAsUser: 568
    runAsGroup: 568
    fsGroup: 568
    fsGroupChangePolicy: "OnRootMismatch"

# Requests/limits from 7-day Prometheus peaks (2026-10-13): CPU request only (no CPU limit, avoids throttling),
# memory request + limit so one app cannot starve the node.
resources:
  requests:
    cpu: 20m
    memory: 256Mi
  limits:
    memory: 1Gi
