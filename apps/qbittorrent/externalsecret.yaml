# gluetun-mullvad Secret (WireGuard creds for the gluetun sidecar), synced from
# OpenBao secret/media/gluetun-mullvad. Gluetun reads it at start, so restart
# qbittorrent after changing the key in OpenBao.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gluetun-mullvad
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: gluetun-mullvad
    creationPolicy: Owner
  data:
    - secretKey: WIREGUARD_ADDRESSES
      remoteRef:
        key: media/gluetun-mullvad
        property: WIREGUARD_ADDRESSES
    - secretKey: WIREGUARD_PRIVATE_KEY
      remoteRef:
        key: media/gluetun-mullvad
        property: WIREGUARD_PRIVATE_KEY
