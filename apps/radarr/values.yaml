env:
  TZ: "Europe/Amsterdam"

service:
  main:
    type: LoadBalancer
    annotations:
      metallb.universe.tf/loadBalancerIPs: "192.168.50.106"
    ports:
      http:
        port: 7878

persistence:
  config:
    enabled: true
    storageClass: longhorn
    size: 1Gi
  media:
    enabled: true
    existingClaim: nfs-media
    mountPath: /media