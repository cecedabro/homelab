env:
  TZ: "Europe/Amsterdam"

service:
  main:
    type: LoadBalancer
    annotations:
      metallb.io/loadBalancerIPs: "192.168.50.106"
    ports:
      http:
        port: 7878

persistence:
  config:
    enabled: true
    storageClass: longhorn
    size: 1Gi
  media:
    enabled: true
    existingClaim: nfs-media
    mountPath: /media

# Run as the same user as qBittorrent (PUID 1000), so imports can hardlink the
# downloaded files instead of silently falling back to a full copy.
# fsGroup lets the existing config volume (owned by 65534) stay writable.
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

# Requests/limits from 7-day Prometheus peaks (2026-10-13): CPU request only (no CPU limit, avoids throttling),
# memory request + limit so one app cannot starve the node.
resources:
  requests:
    cpu: 20m
    memory: 256Mi
  limits:
    memory: 1Gi
