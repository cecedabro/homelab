# Web app: the site (behind the team password) and the Teams outgoing webhook.
# Cloudflare tunnel route (added by hand in the dashboard): http://scrum-agent.scrum-agent.svc.cluster.local:80
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrum-agent
  namespace: scrum-agent
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: scrum-agent}
  template:
    metadata:
      labels: {app: scrum-agent}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      affinity:
        nodeAffinity: # keep off the GPU node and the fullest worker when possible
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - {key: kubernetes.io/hostname, operator: NotIn, values: [k3s-gpu-01, k3s-worker-02]}
      initContainers:
        - name: wait-for-db
          image: ghcr.io/cecedabro/scrum-agent:v1.0.2 # {"$imagepolicy": "flux-system:scrum-agent"}
          command:
            - python
            - -c
            - |
              import socket, time
              while True:
                  try:
                      socket.create_connection(("scrum-agent-db", 5432), timeout=2).close()
                      break
                  except OSError:
                      print("waiting for the database", flush=True)
                      time.sleep(2)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
        - name: migrate
          image: ghcr.io/cecedabro/scrum-agent:v1.0.2 # {"$imagepolicy": "flux-system:scrum-agent"}
          command: [python, -m, alembic, upgrade, head]
          envFrom:
            - secretRef: {name: scrum-agent-app}
          env:
            - {name: APP_ENV, value: production}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 256Mi}
      containers:
        - name: web
          image: ghcr.io/cecedabro/scrum-agent:v1.0.2 # {"$imagepolicy": "flux-system:scrum-agent"}
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - secretRef: {name: scrum-agent-app}
          env:
            - {name: APP_ENV, value: production}
            - {name: TEAM_USER, value: team}
            - {name: LLM_BASE_URL, value: "http://192.168.50.17:8080/v1"}
            - {name: LLM_MODEL, value: coder}
            - {name: WAKER_URL, value: "http://192.168.50.11:9009"}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 256Mi}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: scrum-agent
  namespace: scrum-agent
spec:
  selector: {app: scrum-agent}
  ports:
    - {name: http, port: 80, targetPort: 8000}
