# Secrets from OpenBao (ClusterSecretStore `openbao`, KV v2 at secret/).
# Filled by Cédric: secret/scrum-agent/app  TEAM_PASSWORD, TEAMS_WEBHOOK_URL, TEAMS_HMAC_SECRET
#                   secret/scrum-agent/db   POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD (hex, URL-safe)
# Reused, not copied: ai-agent/devbox LLAMA_API_KEY (the PC's llama-server key), ai-agent/waker WAKER_TOKEN.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scrum-agent-db
  namespace: scrum-agent
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: scrum-agent-db
    creationPolicy: Owner
    template:
      data:
        POSTGRES_DB: '{{ .POSTGRES_DB | trim }}'
        POSTGRES_USER: '{{ .POSTGRES_USER | trim }}'
        POSTGRES_PASSWORD: '{{ .POSTGRES_PASSWORD | trim }}'
  dataFrom:
    - extract: {key: scrum-agent/db}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scrum-agent-app
  namespace: scrum-agent
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: scrum-agent-app
    creationPolicy: Owner
    template:   # trim: pasted values end in a newline
      data:
        DATABASE_URL: 'postgresql+psycopg://{{ .POSTGRES_USER | trim | urlquery }}:{{ .POSTGRES_PASSWORD | trim | urlquery }}@scrum-agent-db:5432/{{ .POSTGRES_DB | trim }}'
        TEAM_PASSWORD: '{{ .TEAM_PASSWORD | trim }}'
        TEAMS_WEBHOOK_URL: '{{ .TEAMS_WEBHOOK_URL | trim }}'
        TEAMS_HMAC_SECRET: '{{ .TEAMS_HMAC_SECRET | trim }}'   # may be empty: @Agent is then off (503)
        LLM_API_KEY: '{{ .LLAMA_API_KEY | trim }}'
        WAKER_TOKEN: '{{ .WAKER_TOKEN | trim }}'
  data:
    - secretKey: TEAM_PASSWORD
      remoteRef: {key: scrum-agent/app, property: TEAM_PASSWORD}
    - secretKey: TEAMS_WEBHOOK_URL
      remoteRef: {key: scrum-agent/app, property: TEAMS_WEBHOOK_URL}
    - secretKey: TEAMS_HMAC_SECRET
      remoteRef: {key: scrum-agent/app, property: TEAMS_HMAC_SECRET}
    - secretKey: POSTGRES_DB
      remoteRef: {key: scrum-agent/db, property: POSTGRES_DB}
    - secretKey: POSTGRES_USER
      remoteRef: {key: scrum-agent/db, property: POSTGRES_USER}
    - secretKey: POSTGRES_PASSWORD
      remoteRef: {key: scrum-agent/db, property: POSTGRES_PASSWORD}
    - secretKey: LLAMA_API_KEY
      remoteRef: {key: ai-agent/devbox, property: LLAMA_API_KEY}
    - secretKey: WAKER_TOKEN
      remoteRef: {key: ai-agent/waker, property: WAKER_TOKEN}
