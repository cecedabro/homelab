# Postgres for the app. The PVC is in Longhorn's default recurring group (nightly backup + B2).
apiVersion: v1
kind: Service
metadata:
  name: scrum-agent-db
  namespace: scrum-agent
spec:
  selector: {app: scrum-agent-db}
  ports:
    - {name: postgres, port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: scrum-agent-db
  namespace: scrum-agent
spec:
  serviceName: scrum-agent-db
  replicas: 1
  selector:
    matchLabels: {app: scrum-agent-db}
  template:
    metadata:
      labels: {app: scrum-agent-db}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      affinity:
        nodeAffinity:   # keep off the GPU node and the fullest worker when possible
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - {key: kubernetes.io/hostname, operator: NotIn, values: [k3s-gpu-01, k3s-worker-02]}
      containers:
        - name: postgres
          image: postgres:16.15-alpine3.24@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
          ports:
            - {name: postgres, containerPort: 5432}
          envFrom:
            - secretRef: {name: scrum-agent-db}
          env:
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}   # subdir: initdb wants to own it
          readinessProbe:
            exec: {command: [sh, -c, 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER"']}
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests: {storage: 5Gi}
