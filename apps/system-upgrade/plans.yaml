# k3s upgrade plans for the system-upgrade-controller (k3s' own upgrade mechanism).
# The version below is THE k3s version of the cluster. Renovate opens a PR when a newer k3s
# release exists; merging it makes the controller upgrade the server first, then the agents,
# one node at a time (cordon + drain), each node replacing its own k3s binary and restarting.
# Same version as the nodes already run = nothing happens.
#
# Upgrades are OPT-IN per node: a plan only touches nodes labelled homelab/k3s-upgrade=allowed.
# (A new plan otherwise runs on every node once, draining all workers even for the same version.)
# Roll out after merging the Renovate PR (server first, agents wait for it automatically):
#   kubectl label nodes --all homelab/k3s-upgrade=allowed
#   kubectl -n system-upgrade get plans,jobs -w        # until both plans are complete
#   kubectl label nodes --all homelab/k3s-upgrade-
#
# Expect during an upgrade: single-replica apps restart once when their node drains, and if the
# drained node runs openbao-0 OpenBao comes back SEALED (alert OpenBaoSealed): unseal it.
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-server
  namespace: system-upgrade
spec:
  concurrency: 1
  cordon: true
  nodeSelector:
    matchExpressions:
      - {key: node-role.kubernetes.io/control-plane, operator: Exists}
      - {key: homelab/k3s-upgrade, operator: In, values: [allowed]}
  tolerations:
    - {operator: Exists}
  serviceAccountName: system-upgrade
  upgrade:
    image: rancher/k3s-upgrade
  # renovate: datasource=github-releases depName=k3s-io/k3s
  version: v1.35.9+k3s1
---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-agent
  namespace: system-upgrade
spec:
  concurrency: 1
  cordon: true
  nodeSelector:
    matchExpressions:
      - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
      - {key: homelab/k3s-upgrade, operator: In, values: [allowed]}
  tolerations:
    - {operator: Exists}
  serviceAccountName: system-upgrade
  prepare:
    # wait until the server runs the new version before touching the agents
    image: rancher/k3s-upgrade
    args: ["prepare", "k3s-server"]
  drain:
    force: true
    ignoreDaemonSets: true
    deleteEmptydirData: true
    skipWaitForDeleteTimeout: 60
    timeout: 900s
  upgrade:
    image: rancher/k3s-upgrade
  # renovate: datasource=github-releases depName=k3s-io/k3s
  version: v1.35.9+k3s1
