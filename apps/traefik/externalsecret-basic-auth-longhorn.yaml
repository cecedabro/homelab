# Basic-auth login for the Longhorn UI (Traefik middleware basic-auth in this namespace).
# OpenBao secret/monitoring/dashboard-login: username, password.
#  - Secret dashboard-login: plain username/password (for reading it back).
#  - Secret dashboard-basic-auth: ONLY the key "users" with a bcrypt htpasswd line, generated by ESO
#    (Traefik refuses a secret with more than one key). New salt on every refresh, hence 24h.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: dashboard-login, namespace: longhorn-system}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target: {name: dashboard-login, creationPolicy: Owner}
  dataFrom: [{extract: {key: monitoring/dashboard-login}}]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: dashboard-basic-auth, namespace: longhorn-system}
spec:
  refreshInterval: 24h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: dashboard-basic-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        users: '{{ htpasswd .username .password }}'
  dataFrom: [{extract: {key: monitoring/dashboard-login}}]
