# One wildcard certificate for every internal app under *.home.cedricschippers.dev,
# set as Traefik's default certificate so Ingresses don't need their own tls: section.
# cert-manager renews it automatically ~30 days before expiry.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-wildcard
  namespace: kube-system
spec:
  secretName: home-wildcard-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - home.cedricschippers.dev
    - "*.home.cedricschippers.dev"
---
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: kube-system
spec:
  defaultCertificate:
    secretName: home-wildcard-tls
