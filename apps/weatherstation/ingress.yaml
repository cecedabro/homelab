apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: weatherstation
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: weatherstation.home.cedricschippers.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: weatherstation
                port:
                  name: http
