# Ingress: Traefik (weatherstation.home.cedricschippers.dev, LAN + Tailscale), the cloudflare namespace
# (planned public hostname), Homepage/monitoring, LAN/Tailscale ranges for debugging, plus pods in the
# namespace (app -> postgres). Egress: default deny. DNS and postgres only (add the agent-status gateway
# when the advisor is built). Undo: delete this file's objects.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-ingress
  namespace: weatherstation
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: homepage}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: cloudflare}}
        - ipBlock: {cidr: 192.168.50.0/24}
        - ipBlock: {cidr: 100.64.0.0/10}
        # each node's flannel/cni0 address: kube-proxy SNAT and kubelet probes
        - ipBlock: {cidr: 10.42.0.0/32}
        - ipBlock: {cidr: 10.42.0.1/32}
        - ipBlock: {cidr: 10.42.1.0/32}
        - ipBlock: {cidr: 10.42.1.1/32}
        - ipBlock: {cidr: 10.42.2.0/32}
        - ipBlock: {cidr: 10.42.2.1/32}
        - ipBlock: {cidr: 10.42.4.0/32}
        - ipBlock: {cidr: 10.42.4.1/32}
        - ipBlock: {cidr: 10.42.5.0/32}
        - ipBlock: {cidr: 10.42.5.1/32}
        - ipBlock: {cidr: 10.42.7.0/32}
        - ipBlock: {cidr: 10.42.7.1/32}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-egress
  namespace: weatherstation
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: weatherstation-db}}
      ports:
        - {protocol: TCP, port: 5432}
