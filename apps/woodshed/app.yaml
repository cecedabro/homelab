apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: woodshed-media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: woodshed
spec:
  selector:
    app.kubernetes.io/name: woodshed
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: woodshed
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO media volume; migrations never run twice at once
  selector:
    matchLabels:
      app.kubernetes.io/name: woodshed
  template:
    metadata:
      labels:
        app.kubernetes.io/name: woodshed
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [k3s-gpu-01]
      initContainers:
        - name: wait-for-db
          image: postgres:16.15
          command: ["sh", "-c", "until pg_isready -h woodshed-db -p 5432 -U woodshed; do sleep 2; done"]
          securityContext: &restricted
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
        - name: migrate
          image: ghcr.io/cecedabro/woodshed:0.1.3 # {"$imagepolicy": "flux-system:woodshed"}
          workingDir: /app
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: woodshed-app
          env: &env
            - name: APP_ENV
              value: production
            - name: MEDIA_DIR
              value: /data/media
          securityContext: *restricted
          resources:
            requests: {cpu: 25m, memory: 128Mi}
            limits: {memory: 384Mi}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: app
          image: ghcr.io/cecedabro/woodshed:0.1.3 # {"$imagepolicy": "flux-system:woodshed"}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: woodshed-app
          env: *env
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          securityContext: *restricted
          resources:
            requests: {cpu: 25m, memory: 128Mi}
            limits: {memory: 384Mi}
          volumeMounts:
            - name: media
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: woodshed-media
        - name: tmp
          emptyDir: {}
