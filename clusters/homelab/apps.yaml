# Everything under ./apps that is listed in apps/kustomization.yaml.
# prune: false for now, so removing a file from git does NOT delete the object in the cluster.
# Switch to true once the GitOps flow is trusted (then git really is the source of truth).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  path: ./apps
  prune: false
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
